<div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-lg max-w-md mx-auto mt-10">
  <div class="flex items-center gap-2 mb-4 border-b pb-2">
      <i class="ph ph-plus-circle text-blue-600 text-xl"></i>
      <h2 class="text-xl font-bold text-gray-800">Nuevo Producto</h2>
  </div>

  <form #productForm="ngForm" (ngSubmit)="guardar()" class="space-y-4">
    
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Producto *</label>
      <input type="text" [(ngModel)]="producto.nombre" name="nombre" required minlength="3"
             class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
             placeholder="Ej: Tarta de Chocolate">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
      <input type="text" [(ngModel)]="producto.descripcion" name="descripcion"
             class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Precio (€) *</label>
        <input type="number" [(ngModel)]="producto.precio" name="precio" required min="0.1"
               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Stock Inicial *</label>
        <input type="number" [(ngModel)]="producto.stock" name="stock" required min="0"
               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
    </div>

    <button type="submit" 
            [disabled]="!productForm.form.valid"
            class="w-full font-bold py-2 px-4 rounded-xl transition-all shadow-md active:scale-95 text-white
                   bg-blue-600 hover:bg-blue-700 
                   disabled:bg-gray-300 disabled:cursor-not-allowed disabled:shadow-none">
      <i class="ph ph-floppy-disk mr-2"></i> Guardar Producto
    </button>

    <p *ngIf="mensaje" class="text-center font-medium mt-2" 
       [class.text-green-600]="mensaje.includes('éxito')" 
       [class.text-red-600]="mensaje.includes('Error')">
       {{ mensaje }}
    </p>

  </form>
</div>

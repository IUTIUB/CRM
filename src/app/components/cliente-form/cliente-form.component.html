<div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-lg max-w-2xl mx-auto mt-6">
  <div class="flex items-center gap-2 mb-6 border-b pb-2">
    <i class="ph ph-users-three text-2xl text-purple-600"></i>
    <h2 class="text-xl font-bold text-gray-800">Alta de Nuevo Cliente</h2>
  </div>

  <form (ngSubmit)="guardar()" class="space-y-4">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Razón Social / Nombre</label>
        <input type="text" [(ngModel)]="cliente.razonSocial" name="razonSocial" required
               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none"
               placeholder="Ej: Bar Manolo S.L.">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">CIF / NIF</label>
        <input type="text" [(ngModel)]="cliente.cif" name="cif" required
               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none"
               placeholder="Ej: B12345678">
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" [(ngModel)]="cliente.email" name="email"
               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
      </div>
       <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input type="text" [(ngModel)]="cliente.telefono" name="telefono"
               class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
      </div>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Dirección Completa</label>
      <input type="text" [(ngModel)]="cliente.direccion" name="direccion"
             class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Cliente</label>
      <select [(ngModel)]="cliente.tipo" name="tipo" class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 outline-none bg-white">
        <option value="RESTAURANTE">Restaurante</option>
        <option value="CAFETERIA">Cafetería</option>
        <option value="OTRO">Otro</option>
      </select>
    </div>

    <button type="submit" 
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 px-4 rounded-xl transition-all shadow-md active:scale-95 mt-4">
      💾 Guardar Cliente
    </button>

    <p *ngIf="mensaje" class="text-center font-bold mt-2 p-2 rounded" 
       [class.text-green-600]="mensaje.includes('éxito')" 
       [class.text-red-600]="mensaje.includes('Error')">
       {{ mensaje }}
    </p>

  </form>
</div>

<div class="bg-white p-6 rounded-2xl border border-blue-100 shadow-sm">
  
  <div class="flex items-center gap-2 mb-4 border-b border-gray-100 pb-2">
    <i class="ph ph-bread text-xl text-blue-600"></i>
    <h3 class="font-bold text-gray-800 text-lg">Gestión de Inventario</h3>
  </div>

  <ul class="space-y-3">
    <li *ngFor="let producto of productos" class="flex justify-between items-center p-4 hover:bg-gray-50 rounded-xl transition-all border border-gray-100 hover:shadow-md group">
      
      <div>
        <div class="flex items-center gap-2">
            <strong class="text-blue-600 font-bold text-lg">{{ producto.nombre }}</strong>
            <span *ngIf="producto.stock < 10" class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-bold animate-pulse">
              ¡Bajo Stock!
            </span>
        </div>
        <div class="text-sm text-gray-500 mt-1">{{ producto.descripcion }}</div>
      </div>

      <div class="flex items-center gap-6 text-right">
        <div>
            <span class="block font-bold text-gray-800 text-xl">{{ producto.precio }}€</span>
            <span class="text-xs text-gray-400 font-medium">Stock: {{ producto.stock }}</span>
        </div>

        <button (click)="eliminar(producto.id)" 
                class="w-10 h-10 flex items-center justify-center rounded-lg bg-red-50 text-red-600 hover:bg-red-600 hover:text-white transition-all shadow-sm cursor-pointer"
                title="Eliminar producto permanentemente">
            <i class="ph ph-trash text-xl"></i>
        </button>
      </div>

    </li>
  </ul>

  <div *ngIf="productos.length === 0" class="text-center py-10 bg-gray-50 rounded-xl border border-dashed border-gray-300 mt-4">
    <i class="ph ph-cookie text-4xl mb-2 text-gray-400"></i>
    <p class="text-gray-500 font-medium">No hay productos en el inventario.</p>
  </div>
</div>

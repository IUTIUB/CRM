<div class="max-w-3xl mx-auto bg-white shadow-md rounded-lg overflow-hidden p-6 mt-6">
  
  <h2 class="text-2xl font-bold text-gray-800 mb-6">
    {{ esEdicion ? 'Editar Cliente' : 'Nuevo Cliente' }}
  </h2>

  <form [formGroup]="form" (ngSubmit)="guardar()">
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Razón Social *</label>
        <input type="text" formControlName="razonSocial" 
               class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">CIF *</label>
        <input type="text" formControlName="cif" 
               class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Negocio</label>
        <select formControlName="tipo" class="w-full p-2 border border-gray-300 rounded-md bg-white">
          <option value="RESTAURANTE">Restaurante</option>
          <option value="CAFETERIA">Cafetería</option>
          <option value="OTRO">Otro</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
        <input type="email" formControlName="email" 
               class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
        <input type="text" formControlName="telefono" 
               class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      </div>

      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-700 mb-1">Dirección</label>
        <input type="text" formControlName="direccion" 
               class="w-full p-2 border border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500">
      </div>
      
      <div class="col-span-2 flex items-center">
        <input type="checkbox" formControlName="activo" id="activo" class="h-4 w-4 text-blue-600 rounded border-gray-300">
        <label for="activo" class="ml-2 block text-sm text-gray-900">Cliente Activo</label>
      </div>

    </div>

    <div class="mt-8 flex justify-end gap-4">
      <a routerLink="/clientes" class="px-4 py-2 bg-gray-200 text-gray-800 rounded-md hover:bg-gray-300 transition">
        Cancelar
      </a>
      <button type="submit" [disabled]="form.invalid" 
              class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition disabled:bg-blue-300">
        Guardar Cliente
      </button>
    </div>

  </form>
</div>

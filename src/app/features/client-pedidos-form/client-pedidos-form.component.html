<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Pedido - Panadería</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="client-pedidos-form.component.css">
</head>
<body>

    <header class="main-header">
        <div class="header-content">
            <div class="logo-area">
                <span class="logo-icon">PC</span>
                <span class="brand-name">Panadería CRM</span>
            </div>
            <div class="user-area">
                <span>Bienvenido, <strong>Bar Pepe</strong></span>
                <span class="logout-icon">→</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <a routerLink="/portal-cliente" class="back-link">
    <span>←</span> Volver al Dashboard
</a>

        <section class="card form-card">
            <div class="card-header">
                <h1>Realizar un nuevo Pedido</h1>
                <p class="subtitle">Selecciona los productos frescos para tu entrega de mañana.</p>
            </div>

            <form action="#" method="POST" class="order-form">
                
                <div class="form-section">
                    <h2 class="section-title">Datos de Entrega</h2>
                    <div class="form-group">
                        <label for="clienteName">Nombre del Establecimiento *</label>
                        <input type="text" id="clienteName" name="clienteName" placeholder="Ej: Bar Pepe" value="Bar Pepe" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group col-half">
                            <label for="fechaEntrega">Fecha de Entrega *</label>
                            <input type="date" id="fechaEntrega" name="fechaEntrega" required>
                        </div>
                        <div class="form-group col-half">
                             <label for="telefono">Teléfono de Contacto *</label>
                            <input type="tel" id="telefono" name="telefono" placeholder="Ej: 600 123 456" required>
                        </div>
                    </div>
                </div>

                <div class="form-section products-section">
                    <h2 class="section-title">Selección de Productos</h2>
                    <p class="info-text">Indica la cantidad deseada de cada artículo.</p>

                    <div class="product-grid">
                        <div class="product-item">
                            <div class="product-info">
                                <label for="prod-barra">Barra Rústica (250g)</label>
                                <span class="price">0.95€ /ud</span>
                            </div>
                            <input type="number" id="prod-barra" name="cantidad[barra]" min="0" placeholder="0" class="qty-input">
                        </div>
                        <div class="product-item">
                            <div class="product-info">
                                <label for="prod-hogaza">Hogaza de Masa Madre (500g)</label>
                                <span class="price">2.50€ /ud</span>
                            </div>
                            <input type="number" id="prod-hogaza" name="cantidad[hogaza]" min="0" placeholder="0" class="qty-input">
                        </div>
                         <div class="product-item">
                            <div class="product-info">
                                <label for="prod-chapata">Chapata Artesana</label>
                                <span class="price">1.20€ /ud</span>
                            </div>
                            <input type="number" id="prod-chapata" name="cantidad[chapata]" min="0" placeholder="0" class="qty-input">
                        </div>
                         <div class="product-item">
                            <div class="product-info">
                                <label for="prod-croissant">Croissant de Mantequilla</label>
                                <span class="price">1.50€ /ud</span>
                            </div>
                            <input type="number" id="prod-croissant" name="cantidad[croissant]" min="0" placeholder="0" class="qty-input">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-group">
                        <label for="notas">Notas Adicionales del Pedido</label>
                        <textarea id="notas" name="notas" placeholder="Ej: El pan de molde cortado en rebanadas finas, entregar antes de las 10h..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-cancel">Cancelar</button>
                    <button type="submit" class="btn btn-submit">Enviar Pedido</button>
                </div>

            </form>
        </section>
    </main>
    
</body>
</html>

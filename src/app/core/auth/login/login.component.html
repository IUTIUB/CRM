<div class="min-h-screen bg-gray-100 flex items-center justify-center p-4">
  
  <div class="bg-white shadow-xl rounded-2xl overflow-hidden w-full max-w-md flex flex-col animate-fade-in-up">
    
    <div class="bg-blue-600 p-8 text-center">
      <h1 class="text-3xl font-bold text-white tracking-wider">PANADERÍA CRM</h1>
      <p class="text-blue-100 mt-2">Gestión integral para tu negocio</p>
    </div>

    <div class="p-8">
      
      <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
        {{ isRegister ? 'Crear Cuenta' : 'Bienvenido de nuevo' }}
      </h2>

      <form (ngSubmit)="onSubmit()">
        
        @if (isRegister) {
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del Negocio</label>
            <input type="text" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
          </div>
        }

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Correo Electrónico</label>
          <input type="email" [(ngModel)]="email" name="email" placeholder="admin@panaderia.com"
                 class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
        </div>

        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
          <input type="password" [(ngModel)]="password" name="password" placeholder="1234"
                 class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
        </div>

        <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition shadow-md hover:shadow-lg">
          {{ isRegister ? 'Registrarse' : 'Iniciar Sesión' }}
        </button>

      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        {{ isRegister ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}
        <button (click)="toggleRegister()" class="text-blue-600 font-bold hover:underline ml-1">
          {{ isRegister ? 'Inicia Sesión' : 'Regístrate aquí' }}
        </button>
      </div>
      
      <div class="mt-8 p-3 bg-gray-50 rounded text-xs text-gray-500 border border-gray-200">
        <p class="font-bold">Usuarios de prueba:</p>
        <p>Admin: admin&#64;panaderia.com / 1234</p>
        <p>Cliente: cliente&#64;bar.com / 1234</p>
      </div>

    </div>
  </div>
</div>

# Database Configuration
# 1. La URL de la base de datos (panaderia_crm)
spring.datasource.url=jdbc:mysql://localhost:3306/panaderia_crm?createDatabaseIfNotExist=true&serverTimezone=UTC

# 2. El Usuario (normalmente es root)
spring.datasource.username=root

# 3. La Contraseña (asegúrate de que tu contraseña de MySQL es realmente "root")
spring.datasource.password=root

# 4. El Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings (helps see SQL in the console)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect